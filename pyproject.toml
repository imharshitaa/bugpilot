[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bugpilot"
version = "1.0.0"
description = "BugPilot security testing orchestrator"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "requests>=2.28,<3.0",
  "beautifulsoup4>=4.11,<5.0",
  "PyYAML>=6.0,<7.0",
  "urllib3>=2.0,<3.0",
  "rich>=13.0,<14.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0", "Flask>=3.0"]
demo = ["fastapi>=0.112,<1.0", "uvicorn>=0.30,<1.0"]

[project.scripts]
bugpilot = "bugpilot_cli:cli"

[tool.setuptools]
py-modules = ["main", "bugpilot_cli"]
